[project]
name = "agent-benchmark"
version = "0.1.0"
description = "A reproducible benchmark and leaderboard for question-answering and research-agent systems. Measures the research-agent project against a single-shot RAG baseline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["gradio>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
agent-benchmark = "agent_benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_benchmark"]

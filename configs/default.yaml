# Benchmark configuration. Swap systems/params here; no code changes needed.
dataset: data/techdocs_qa.jsonl

metrics:
  - coverage
  - grounding
  # - correctness          # LLM-as-judge; needs judge_provider + an API key

# judge_provider: openai   # uncomment when using the 'correctness' metric

concurrency: 4

systems:
  # Two offline stub systems so the harness runs with no API key.
  # Their numbers only illustrate the format -- see the commented real systems.
  - name: strong-stub
    system: fake
    params: { quality: high, with_citations: true }
  - name: weak-stub
    system: fake
    params: { quality: low, with_citations: false }


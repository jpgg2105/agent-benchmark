name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The agent systems import research-agent, which lives in its own repo.
      - run: pip install "research-agent @ git+https://github.com/jpgg2105/research-agent"
      - run: pip install -e ".[dev]"
      - run: pytest -q
